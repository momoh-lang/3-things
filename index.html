<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>٣ حاجات</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#000; --surface:#141414; --line:#262626; --text:#fff; --muted:#8a8a8a;
  --lime:#ccff00; --lime-ink:#101400; --lime-dim:#7a9400;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Roboto,Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
body{height:100%;padding-bottom:0}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 8px}
header h1{margin:0;font-size:28px;font-weight:800;color:var(--lime)}
.icon-btn{background:none;border:0;color:var(--lime);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;cursor:pointer}
.icon-btn:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
.icon-btn svg{width:24px;height:24px}
main{flex:1;overflow-y:auto;padding:8px 20px 24px}

/* Today */
.ask{text-align:center;font-size:19px;line-height:1.6;margin:22px 8px 28px;font-weight:600}
.slot{display:flex;align-items:center;gap:14px;min-height:92px;border-bottom:1px solid var(--line)}
.slot:last-child{border-bottom:0}
.ring{flex:none;width:30px;height:30px;border-radius:50%;border:2.5px solid var(--lime);background:none;cursor:pointer;display:grid;place-items:center;padding:0;color:var(--lime-ink);transition:background .15s}
.ring.done{background:var(--lime)}
.ring svg{width:18px;height:18px;opacity:0}
.ring.done svg{opacity:1}
.slot .name{flex:1;font-size:18px;word-break:break-word}
.slot.done .name{color:var(--muted);text-decoration:line-through}
.slot.empty{cursor:pointer;color:var(--muted)}
.slot.empty .ring{border-color:var(--line);border-style:dashed}
.slot.empty .name{font-size:16px}
.more{background:none;border:0;color:var(--muted);width:40px;height:40px;cursor:pointer;font-size:22px;border-radius:50%}
.allDone{text-align:center;color:var(--lime);font-weight:800;font-size:20px;margin:18px 0 0}

/* Future */
.row{display:flex;align-items:center;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.row .ring{width:24px;height:24px;border-width:2px;border-color:var(--line);cursor:default}
.row .name{flex:1;font-size:17px;word-break:break-word}
.row .date{font-size:13px;color:var(--muted)}
.empty-note{color:var(--muted);text-align:center;margin:60px 20px;line-height:1.8}

/* Past */
.card{border-radius:16px;padding:16px 18px;margin-bottom:12px;border:1px solid var(--line);background:var(--bg)}
.card.lime{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.card .t{font-weight:800;font-size:15px}
.card .n{font-size:34px;font-weight:800;line-height:1.3}
.card .s{font-size:13px;opacity:.75}
h2{font-size:18px;margin:26px 0 6px}
.day{color:var(--lime);font-size:14px;font-weight:600;margin:14px 0 4px}
.comp{padding:8px 0;border-bottom:1px solid var(--line);font-size:16px}

/* Me */
.item{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);font-size:17px}
.pill{background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:99px;padding:8px 16px;font:inherit;font-size:15px;cursor:pointer}
.pill.danger{color:#ff6b6b}
.about{color:var(--muted);line-height:1.9;margin-top:22px;font-size:15px}

/* nav */
nav{display:flex;background:var(--lime);color:var(--lime-ink);padding:8px 4px 10px}
nav button{flex:1;background:none;border:0;color:inherit;font:inherit;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:0}
nav .pillbg{width:62px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
nav button[aria-current="page"] .pillbg{background:rgba(16,20,0,.16)}
nav svg{width:22px;height:22px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:5}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px));display:none;z-index:6}
.sheet.open{display:block}
.sheet input{width:100%;background:transparent;border:1px solid #444;border-radius:6px;color:var(--text);font:inherit;font-size:17px;padding:14px;margin-bottom:12px}
.sheet input[type=date]{color-scheme:dark}
.sheet label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.btns{display:flex;gap:12px;margin-top:4px}
.btns button{flex:1;height:48px;border-radius:24px;font:inherit;font-weight:800;font-size:15px;cursor:pointer}
.b-cancel{background:none;border:2px solid var(--lime);color:var(--lime)}
.b-add{background:var(--lime);border:2px solid var(--lime);color:var(--lime-ink)}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--lime);color:var(--lime-ink);padding:10px 18px;border-radius:99px;font-weight:600;font-size:14px;z-index:9;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header><h1 id="title"></h1><span id="hAction"></span></header>
  <main id="main"></main>
  <nav id="nav"></nav>
</div>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <input id="fName" type="text" maxlength="80" autocomplete="off">
  <div id="dateWrap"><label id="dateLbl" for="fDate"></label><input id="fDate" type="date"></div>
  <div class="btns"><button class="b-cancel" id="bCancel"></button><button class="b-add" id="bAdd"></button></div>
</div>
<div class="toast" id="toast"></div>

<script src="admob-config.js"></script>
<script>
const T={
ar:{app:"٣ حاجات",today:"النهارده",future:"بعدين",past:"اللي فات",me:"أنا",
 ask:"إيه أهم ٣ حاجات النهارده؟",addHint:"اضغط وضيف مهمة",taskName:"اسم المهمة",cancel:"إلغاء",add:"إضافة",
 allDone:"خلّصت التلات حاجات 🎉",none:"مفيش مهام جاية.\nاضغط + وضيف حاجة لوقت تاني.",date:"التاريخ",
 curStreak:"الاستمرارية الحالية",curSub:"أيام ورا بعض اتنجز فيها",longStreak:"أطول استمرارية",longSub:"أفضل رقم ليك",
 month:"الشهر ده",year:"السنة دي",done:"مهام اتنجزت",recent:"آخر اللي خلّصته",todayL:"النهارده",yest:"امبارح",
 nothing:"لسه مخلّصتش حاجة.",lang:"اللغة",langBtn:"English",reset:"مسح كل البيانات",resetBtn:"مسح",confirmReset:"متأكد إنك عايز تمسح كل حاجة؟",
 del:"حذف",menu:"حذف المهمة؟",clear:"تصفير النهارده",cleared:"اتصفّرت المهام غير المنجزة",full:"النهارده مليان — ٣ بس!",
 about:"الفكرة بسيطة: يوم واحد، ٣ مهام بس. الحد ده مش عيب، ده الميزة — بيخليك تختار الأهم وتخلّصه.\nبياناتك محفوظة على جهازك بس.",
 moved:"اتنقلت مهام فاتت لليوم"},
en:{app:"3 Things",today:"Today",future:"Future",past:"Past",me:"Me",
 ask:"What are the three most important things for today?",addHint:"Tap to add a task",taskName:"Task name",cancel:"Cancel",add:"Add",
 allDone:"All three done 🎉",none:"No upcoming tasks.\nTap + to plan something for later.",date:"Date",
 curStreak:"Current Streak",curSub:"Consecutive days completed",longStreak:"Longest Streak",longSub:"Best streak ever",
 month:"This Month",year:"This Year",done:"Completed tasks",recent:"Recent Completions",todayL:"Today",yest:"Yesterday",
 nothing:"Nothing completed yet.",lang:"Language",langBtn:"العربية",reset:"Erase all data",resetBtn:"Erase",confirmReset:"Erase everything?",
 del:"Delete",menu:"Delete this task?",clear:"Clear today",cleared:"Unfinished tasks cleared",full:"Today is full — only 3!",
 about:"One day, three tasks. The limit is the feature: it forces you to pick what matters and finish it.\nYour data stays on this device only.",
 moved:"Missed tasks moved to today"}
};
const KEY="3things:v1";
let S={lang:"ar",tasks:[]};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const t=k=>T[S.lang][k];
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const addDays=(s,n)=>{const [y,m,d]=s.split("-").map(Number);return ymd(new Date(y,m-1,d+n))};
const today=()=>ymd(new Date());
const esc=s=>s.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const todayTasks=()=>S.tasks.filter(x=>x.date===today());

// roll missed tasks into today while slots are free; the rest wait for tomorrow
function rollover(){
  const td=today();let moved=0;
  const missed=S.tasks.filter(x=>!x.done&&x.date<td).sort((a,b)=>a.date.localeCompare(b.date));
  missed.forEach(x=>{
    if(todayTasks().length<3){x.date=td;moved++}else{x.date=addDays(td,1)}
  });
  // future tasks whose day has come
  S.tasks.filter(x=>!x.done&&x.date===td);
  if(moved){save();setTimeout(()=>toast(t("moved")),400)}
}

const ic={
 sun:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
 cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>',
 bars:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="11" width="4" height="9" rx="1"/><rect x="10" y="4" width="4" height="16" rx="1"/><rect x="16" y="14" width="4" height="6" rx="1"/></svg>',
 me:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/></svg>',
 plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
 reset:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.6-5.9"/><path d="M20 4v5h-5"/></svg>',
 check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>'
};

let tab="today";
const tabs=[["today","sun"],["future","cal"],["past","bars"],["me","me"]];

function render(){
  document.documentElement.lang=S.lang;
  document.documentElement.dir=S.lang==="ar"?"rtl":"ltr";
  document.title=t("app");
  document.getElementById("title").textContent=tab==="today"?t("app"):t(tab);
  const ha=document.getElementById("hAction");
  ha.innerHTML=tab==="today"?`<button class="icon-btn" id="clearBtn" aria-label="${t("clear")}">${ic.reset}</button>`
    :tab==="future"?`<button class="icon-btn" id="plusBtn" aria-label="${t("add")}">${ic.plus}</button>`:"";
  document.getElementById("nav").innerHTML=tabs.map(([k,i])=>`<button data-tab="${k}" ${k===tab?'aria-current="page"':""}><span class="pillbg">${ic[i]}</span>${t(k)}</button>`).join("");
  const m=document.getElementById("main");
  m.innerHTML=({today:vToday,future:vFuture,past:vPast,me:vMe})[tab]();
  m.scrollTop=0;
}

function vToday(){
  const list=todayTasks().slice(0,3);
  let h=`<p class="ask">${t("ask")}</p>`;
  for(let i=0;i<3;i++){
    const x=list[i];
    if(x)h+=`<div class="slot ${x.done?"done":""}"><button class="ring ${x.done?"done":""}" data-toggle="${x.id}" aria-label="${esc(x.name)}">${ic.check}</button><span class="name">${esc(x.name)}</span><button class="more" data-del="${x.id}" aria-label="${t("del")}">⋮</button></div>`;
    else h+=`<div class="slot empty" data-addslot="1" role="button" tabindex="0"><span class="ring"></span><span class="name">${t("addHint")}</span></div>`;
  }
  if(list.length===3&&list.every(x=>x.done))h+=`<p class="allDone">${t("allDone")}</p>`;
  return h;
}

function fmtDate(s){
  const [y,m,d]=s.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(S.lang==="ar"?"ar-EG":"en-US",{weekday:"short",day:"numeric",month:"short"});
}

function vFuture(){
  const td=today();
  const list=S.tasks.filter(x=>!x.done&&x.date>td).sort((a,b)=>a.date.localeCompare(b.date));
  if(!list.length)return `<p class="empty-note">${t("none").replace("\n","<br>")}</p>`;
  return list.map(x=>`<div class="row"><span class="ring"></span><span class="name">${esc(x.name)}</span><span class="date">${fmtDate(x.date)}</span><button class="more" data-del="${x.id}" aria-label="${t("del")}">⋮</button></div>`).join("");
}

function stats(){
  const doneDays=new Set(S.tasks.filter(x=>x.done&&x.doneOn).map(x=>x.doneOn));
  const td=today();
  let cur=0,d=doneDays.has(td)?td:addDays(td,-1);
  while(doneDays.has(d)){cur++;d=addDays(d,-1)}
  const days=[...doneDays].sort();let best=0,run=0,prev=null;
  days.forEach(x=>{run=(prev&&addDays(prev,1)===x)?run+1:1;if(run>best)best=run;prev=x});
  const done=S.tasks.filter(x=>x.done&&x.doneOn);
  return{cur,best,month:done.filter(x=>x.doneOn.slice(0,7)===td.slice(0,7)).length,year:done.filter(x=>x.doneOn.slice(0,4)===td.slice(0,4)).length,done};
}

function vPast(){
  const s=stats();
  let h=`<div class="card lime"><div class="t">${t("curStreak")}</div><div class="n">${s.cur}</div><div class="s">${t("curSub")}</div></div>
  <div class="card lime"><div class="t">${t("longStreak")}</div><div class="n">${s.best}</div><div class="s">${t("longSub")}</div></div>
  <div class="card"><div class="t">${t("month")}</div><div class="n">${s.month}</div><div class="s">${t("done")}</div></div>
  <div class="card"><div class="t">${t("year")}</div><div class="n">${s.year}</div><div class="s">${t("done")}</div></div>
  <h2>${t("recent")}</h2>`;
  if(!s.done.length)return h+`<p class="empty-note" style="margin:24px 0">${t("nothing")}</p>`;
  const by={};s.done.forEach(x=>(by[x.doneOn]=by[x.doneOn]||[]).push(x));
  const td=today();
  Object.keys(by).sort().reverse().slice(0,30).forEach(day=>{
    const label=day===td?t("todayL"):day===addDays(td,-1)?t("yest"):fmtDate(day);
    h+=`<div class="day">${label}</div>`+by[day].map(x=>`<div class="comp">${esc(x.name)}</div>`).join("");
  });
  return h;
}

function vMe(){
  return `<div class="item"><span>${t("lang")}</span><button class="pill" id="langBtn">${t("langBtn")}</button></div>
  <div class="item"><span>${t("reset")}</span><button class="pill danger" id="resetBtn">${t("resetBtn")}</button></div>
  <p class="about">${t("about").replace("\n","<br><br>")}</p>`;
}

/* sheet */
let sheetMode="today";
function openSheet(mode){
  sheetMode=mode;
  const n=document.getElementById("fName");
  n.value="";n.placeholder=t("taskName");
  document.getElementById("dateWrap").style.display=mode==="future"?"block":"none";
  document.getElementById("dateLbl").textContent=t("date");
  const dt=document.getElementById("fDate");dt.min=addDays(today(),1);dt.value=addDays(today(),1);
  document.getElementById("bCancel").textContent=t("cancel");
  document.getElementById("bAdd").textContent=t("add");
  document.getElementById("scrim").classList.add("open");
  document.getElementById("sheet").classList.add("open");
  setTimeout(()=>n.focus(),50);
}
function closeSheet(){
  document.getElementById("scrim").classList.remove("open");
  document.getElementById("sheet").classList.remove("open");
}
function submit(){
  const name=document.getElementById("fName").value.trim();
  if(!name)return;
  let date=today();
  if(sheetMode==="future"){
    date=document.getElementById("fDate").value||addDays(today(),1);
    if(date<=today())date=addDays(today(),1);
  }else if(todayTasks().length>=3){closeSheet();toast(t("full"));return}
  S.tasks.push({id:uid(),name,date,done:false,doneOn:null});
  save();closeSheet();render();
}

let tt;
function toast(msg){
  const el=document.getElementById("toast");el.textContent=msg;el.classList.add("show");
  clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2200);
}

/* events */
document.addEventListener("click",e=>{
  const c=e.target.closest("[data-tab],[data-toggle],[data-del],[data-addslot],#plusBtn,#clearBtn,#langBtn,#resetBtn,#bCancel,#bAdd,#scrim");
  if(!c)return;
  if(c.dataset.tab){tab=c.dataset.tab;render();return}
  if(c.dataset.toggle){
    const x=S.tasks.find(y=>y.id===c.dataset.toggle);
    x.done=!x.done;x.doneOn=x.done?today():null;save();render();return;
  }
  if(c.dataset.del){
    if(confirm(t("menu"))){S.tasks=S.tasks.filter(y=>y.id!==c.dataset.del);save();render()}return;
  }
  if(c.dataset.addslot){openSheet("today");return}
  switch(c.id){
    case "plusBtn":openSheet("future");break;
    case "clearBtn":S.tasks=S.tasks.filter(x=>!(x.date===today()&&!x.done));save();render();toast(t("cleared"));break;
    case "langBtn":S.lang=S.lang==="ar"?"en":"ar";save();render();break;
    case "resetBtn":if(confirm(t("confirmReset"))){S.tasks=[];save();render()}break;
    case "bCancel":case "scrim":closeSheet();break;
    case "bAdd":submit();break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.id==="fName")submit();
  if(e.key==="Escape")closeSheet();
  if((e.key==="Enter"||e.key===" ")&&e.target.dataset&&e.target.dataset.addslot){e.preventDefault();openSheet("today")}
});
document.addEventListener("visibilitychange",()=>{if(!document.hidden){rollover();render()}});


// Native AdMob banner (Android/iOS). In a normal browser this safely does nothing.
// The banner is placed above the app's bottom navigation so it does not cover it.
let admobStarted=false;
async function startAdMob(){
  if(admobStarted) return;
  const cfg=window.ADMOB_CONFIG||{};
  const AdMob=window.Capacitor?.Plugins?.AdMob;
  if(!AdMob || !cfg.bannerAdId) return;
  try{
    // Consent should be handled before requesting ads.
    let consentInfo=await AdMob.requestConsentInfo();
    if(consentInfo?.isConsentFormAvailable && consentInfo?.status==='REQUIRED' && AdMob.showConsentForm){
      consentInfo=await AdMob.showConsentForm();
    }
    if(consentInfo && consentInfo.canRequestAds===false) return;

    await AdMob.initialize();
    await AdMob.showBanner({
      adId:cfg.bannerAdId,
      adSize:'ADAPTIVE_BANNER',
      position:'BOTTOM_CENTER',
      // Keep the banner above the bottom navigation.
      margin:64,
      // TRUE during testing; change to FALSE only for the final production build.
      isTesting:!!cfg.isTesting
    });
    admobStarted=true;
  }catch(err){
    console.warn('AdMob could not start:',err);
  }
}

rollover();render();
setTimeout(startAdMob,700);
</script>
</body>
</html>
